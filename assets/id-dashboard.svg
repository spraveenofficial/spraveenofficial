    <pattern id="id-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#99b1db" opacity="0.12"/>
    </pattern>

    <clipPath id="id-clip">
      <rect x="2" y="2" width="1196" height="576" rx="20"/>
    </clipPath>
    <clipPath id="badge-photo-clip">
      <rect x="0" y="0" width="110" height="110" rx="10"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="576" rx="20" fill="url(#id-card-bg)" stroke="url(#id-border)" stroke-width="2"/>

