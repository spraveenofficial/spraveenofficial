<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="id-title id-desc">
  <title id="id-title">Praveen Kumar Singh — Builder ID &amp; Dashboard</title>
  <desc id="id-desc">Public telemetry and verified developer pass: 52+ public repos, 37+ followers.</desc>

  <style>
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 500;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      fill: #8e9db9;
    }
    @keyframes swingBadge {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }
    .badge-swing {
      transform-origin: 220px 20px;
      animation: swingBadge 6s ease-in-out infinite;
    }
    @keyframes pulseLed {
      0%, 100% { fill: #00f2fe; filter: drop-shadow(0 0 8px #00f2fe); }
      50% { fill: #0d4b68; filter: none; }
    }
    .led-glow {
      animation: pulseLed 2.2s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="id-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#567394" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="id-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1220" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="pass-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#090e1a"/>
