          <rect x="140" y="0" width="4" height="34" fill="#6c82a5"/>
          <rect x="148" y="0" width="8" height="34" fill="#6c82a5"/>
          <rect x="160" y="0" width="2" height="34" fill="#6c82a5"/>
          <rect x="166" y="0" width="6" height="34" fill="#6c82a5"/>
          <rect x="176" y="0" width="3" height="34" fill="#6c82a5"/>
          <rect x="183" y="0" width="7" height="34" fill="#6c82a5"/>
          <rect x="194" y="0" width="4" height="34" fill="#6c82a5"/>
          <rect x="202" y="0" width="2" height="34" fill="#6c82a5"/>
          <rect x="208" y="0" width="8" height="34" fill="#6c82a5"/>
          <rect x="220" y="0" width="3" height="34" fill="#6c82a5"/>
