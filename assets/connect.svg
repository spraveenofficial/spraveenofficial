<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="connect-title connect-desc">
  <title id="connect-title">Praveen Kumar Singh — Let&apos;s Build What&apos;s Next</title>
  <desc id="connect-desc">Connect with Praveen across LinkedIn, Twitter/X, Medium, Portfolio, and GitHub.</desc>

  <style>
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 500;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      fill: #8e9db9;
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-1200px); }
      60%, 100% { transform: translateX(1200px); }
    }
    .light-sweep {
      animation: sweepGlow 7s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="connect-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#567394" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="connect-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1220" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="link-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10192c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090e1a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="sweep-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="connect-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#99b1db" opacity="0.12"/>
    </pattern>

    <clipPath id="connect-clip">
      <rect x="2" y="2" width="1196" height="376" rx="20"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="376" rx="20" fill="url(#connect-bg)" stroke="url(#connect-border)" stroke-width="2"/>

  <g clip-path="url(#connect-clip)">
    <rect x="0" y="0" width="1200" height="380" fill="url(#connect-dots)"/>
    <rect x="0" y="0" width="400" height="380" fill="url(#sweep-grad)" class="light-sweep" transform="skewX(-20)"/>

    <!-- Header -->
    <g transform="translate(60, 48)">
      <text x="0" y="14" class="text-mono" font-size="11.5" fill="#247bff" letter-spacing="2">05 // LET&apos;S BUILD WHAT&apos;S NEXT</text>
      <text x="0" y="52" class="text-title" font-size="34">AVAILABLE FOR CONTRACTS, PROJECTS &amp; COLLABORATION</text>
      <text x="0" y="78" class="text-mono" font-size="12" fill="#6c82a5" letter-spacing="1">CONNECT ON LINKEDIN, EXPLORE MY PORTFOLIO, OR READ MY ARTICLES ON MEDIUM</text>
    </g>

    <!-- 5 Glass Connection Cards -->
    <!-- Card 1: LinkedIn -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="200" height="150" rx="14" fill="url(#link-card-bg)" stroke="#1d2d48" stroke-width="1.5"/>
      <g transform="translate(20, 26)">
        <!-- Brand Icon / Tag -->
        <circle cx="16" cy="16" r="16" fill="#0077b5" fill-opacity="0.2"/>
        <text x="16" y="21" class="text-title" font-size="14" fill="#00a0dc" text-anchor="middle">in</text>
        <text x="135" y="16" class="text-mono" font-size="14" fill="#247bff">↗</text>

        <text x="0" y="64" class="text-title" font-size="16">LinkedIn</text>
        <text x="0" y="84" class="text-mono" font-size="11" fill="#8bc6ff">/in/spraveenofficial</text>
      </g>
    </g>

    <!-- Card 2: Twitter / X -->
    <g transform="translate(280, 160)">
      <rect x="0" y="0" width="200" height="150" rx="14" fill="url(#link-card-bg)" stroke="#1d2d48" stroke-width="1.5"/>
      <g transform="translate(20, 26)">
        <circle cx="16" cy="16" r="16" fill="#ffffff" fill-opacity="0.1"/>
        <text x="16" y="22" class="text-title" font-size="14" fill="#ffffff" text-anchor="middle">𝕏</text>
        <text x="135" y="16" class="text-mono" font-size="14" fill="#ffffff">↗</text>

        <text x="0" y="64" class="text-title" font-size="16">X / Twitter</text>
        <text x="0" y="84" class="text-mono" font-size="11" fill="#cadbf7">@spraveenoffice</text>
      </g>
    </g>

    <!-- Card 3: Medium -->
    <g transform="translate(500, 160)">
      <rect x="0" y="0" width="200" height="150" rx="14" fill="url(#link-card-bg)" stroke="#1d2d48" stroke-width="1.5"/>
      <g transform="translate(20, 26)">
        <circle cx="16" cy="16" r="16" fill="#00ab6c" fill-opacity="0.15"/>
        <text x="16" y="21" class="text-title" font-size="14" fill="#00ab6c" text-anchor="middle">M</text>
        <text x="135" y="16" class="text-mono" font-size="14" fill="#00ab6c">↗</text>

        <text x="0" y="64" class="text-title" font-size="16">Medium</text>
        <text x="0" y="84" class="text-mono" font-size="11" fill="#8bc6ff">@spraveenofficial</text>
      </g>
    </g>

    <!-- Card 4: Portfolio -->
    <g transform="translate(720, 160)">
      <rect x="0" y="0" width="200" height="150" rx="14" fill="url(#link-card-bg)" stroke="#1d2d48" stroke-width="1.5"/>
      <g transform="translate(20, 26)">
        <circle cx="16" cy="16" r="16" fill="#ff354f" fill-opacity="0.15"/>
        <text x="16" y="22" class="text-title" font-size="14" fill="#ff354f" text-anchor="middle">⚡</text>
        <text x="135" y="16" class="text-mono" font-size="14" fill="#ff354f">↗</text>

        <text x="0" y="64" class="text-title" font-size="16">Portfolio</text>
        <text x="0" y="84" class="text-mono" font-size="11" fill="#ffd4dc">Live Web Showcase</text>
      </g>
    </g>

    <!-- Card 5: GitHub -->
    <g transform="translate(940, 160)">
      <rect x="0" y="0" width="200" height="150" rx="14" fill="url(#link-card-bg)" stroke="#1d2d48" stroke-width="1.5"/>
      <g transform="translate(20, 26)">
        <circle cx="16" cy="16" r="16" fill="#00f2fe" fill-opacity="0.15"/>
        <text x="16" y="22" class="text-title" font-size="14" fill="#00f2fe" text-anchor="middle">⌘</text>
        <text x="135" y="16" class="text-mono" font-size="14" fill="#00f2fe">↗</text>

        <text x="0" y="64" class="text-title" font-size="16">GitHub</text>
        <text x="0" y="84" class="text-mono" font-size="11" fill="#a5f3fc">@spraveenofficial</text>
      </g>
    </g>
  </g>
</svg>