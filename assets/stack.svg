<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">Praveen Kumar Singh — My Engine Room</title>
  <desc id="stack-desc">Orbital stack overview: TypeScript, JavaScript, Python, React, Node.js, C++, and database tooling.</desc>

  <style>
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 500;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      fill: #8e9db9;
    }
    @keyframes orbitPulse {
      0%, 100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 0.15; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }
    .orbit-pulse {
      animation: orbitPulse 4s ease-in-out infinite;
    }
    .orbit-stream {
      animation: dashCycle 14s linear infinite;
    }
    .orbit-stream-rev {
      animation: dashCycle 18s linear infinite reverse;
    }
  </style>

  <defs>
    <linearGradient id="stack-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#567394" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="stack-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1220" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0.98"/>
    </linearGradient>

    <radialGradient id="stack-halo" cx="240" cy="400" r="280">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stack-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#99b1db" opacity="0.12"/>
    </pattern>

    <clipPath id="stack-clip">
      <rect x="2" y="2" width="1196" height="656" rx="20"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="656" rx="20" fill="url(#stack-card-bg)" stroke="url(#stack-border)" stroke-width="2"/>

  <g clip-path="url(#stack-clip)">
    <rect x="0" y="0" width="1200" height="660" fill="url(#stack-dots)"/>
    <rect x="0" y="0" width="1200" height="660" fill="url(#stack-halo)"/>

    <!-- Header Section -->
    <g transform="translate(60, 48)">
      <text x="0" y="14" class="text-mono" font-size="11.5" fill="#247bff" letter-spacing="2">03 // MY ENGINE ROOM</text>
      <text x="0" y="52" class="text-title" font-size="36">TOOLS CHANGE. CURIOSITY DOESN&apos;T.</text>
      <text x="0" y="78" class="text-mono" font-size="12" fill="#6c82a5" letter-spacing="1">LANGUAGES / FRAMEWORKS / DATABASES / CLOUD &amp; AI</text>
