      <ellipse cx="0" cy="0" rx="190" ry="140" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="60 400" class="orbit-stream"/>

      <!-- Mid Orbit -->
      <ellipse cx="0" cy="0" rx="145" ry="105" fill="none" stroke="#ff354f" stroke-opacity="0.3" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="145" ry="105" fill="none" stroke="#ff354f" stroke-width="2" stroke-dasharray="45 320" class="orbit-stream-rev"/>

